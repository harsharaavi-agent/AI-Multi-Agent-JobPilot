services:
  - type: web
    name: ai-multi-agent-jobpilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: JOBPILOT_API_KEY
        sync: false
